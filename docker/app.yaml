version: '3.9'

services:
  finance_app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    container_name: ${DOCKER_CONFIG__APP_CONTAINER}
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - "../finance:/app/finance"
    networks:
      - finance_network
    ports:
      - "2313:2313"
    depends_on:
      - finance_db

  finance_db:
    image: postgres:16
    container_name: ${DOCKER_CONFIG__STORAGE_CONTAINER}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_DB_CONFIG__USER}
      POSTGRES_PASSWORD: ${POSTGRES_DB_CONFIG__PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_CONFIG__NAME}
    ports:
      - "${POSTGRES_DB_CONFIG__PORT:-5432}:5432"
    volumes:
      - finance_postgres_data:/var/lib/postgresql/data
    networks:
      - finance_network

volumes:
  finance_postgres_data:

networks:
  finance_network:
    driver: bridge
